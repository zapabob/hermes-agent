# Hermes skin: GPT-Image2 Warm Theme
# Designed from reference image: warm neutral grays with subtle gold/beige accents
# Themes CLI, TUI, and desktop GUI from one file

name: gpt-image2-warm
description: "GPT-Image2 Warm — soft neutrals, warm grays, subtle gold accents"

colors:
  # Base surface — warm neutral gray-beige
  background: "#b5afa9"

  # Brand accent — warm gold/beige from reference image highlights
  ui_accent: "#e1d3b8"
  banner_accent: "#e1d3b8"

  # Text hierarchy — dark warm grays for readability
  banner_title: "#3a3633"
  banner_text: "#4a4541"
  ui_text: "#4a4541"
  banner_dim: "#7a746f"
  banner_border: "#9a948d"
  ui_border: "#9a948d"

  # Semantic status — warm variants
  ui_ok: "#8fab8f"
  ui_warn: "#d4b87a"
  ui_error: "#c47a6a"

  # CLI / TUI chrome
  prompt: "#3a3633"
  input_rule: "#e1d3b8"
  response_border: "#c3c3c6"
  status_bar_bg: "#9a948d"
  status_bar_text: "#fefefe"
  status_bar_good: "#8fab8f"
  status_bar_warn: "#d4b87a"
  status_bar_critical: "#c47a6a"
  session_label: "#c3c3c6"
  session_border: "#9a948d"

  # Tool call marker (the ● spinner) — warm gold
  ui_tool: "#d4b87a"

  # Thinking/reasoning text — muted warm
  ui_thinking: "#7a746f"

  # Syntax highlighting — warm palette
  syntax_string: "#8fab8f"
  syntax_number: "#d4b87a"
  syntax_keyword: "#c47a6a"
  syntax_comment: "#7a746f"
  syntax_function: "#e1d3b8"
  syntax_class: "#c3c3c6"
  syntax_operator: "#d4b87a"
  syntax_punctuation: "#9a948d"

  # Completion menu
  completion_menu_bg: "#a8a29b"
  completion_menu_current_bg: "#8d8780"
  completion_menu_meta_bg: "#9a948d"

  # Spinner
  spinner_color: "#d4b87a"

  # Diff colors
  diff_added: "#8fab8f"
  diff_removed: "#c47a6a"
  diff_added_word: "#a8c8a8"
  diff_removed_word: "#e8a898"

# Optional flavor — Hakua's warm voice
branding:
  agent_name: "はくあ"
  prompt_symbol: "❯"
  welcome: "GPT-Image2 Warm 起動。今日もよろしくね、パパ。"
  goodbye: "お疲れ様。またね。"
  help_header: "(^_^) コマンド一覧"

tool_prefix: "┊"