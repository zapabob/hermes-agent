# Hermes skin: Hakua Cyber — GPT-image-2 futuristic theme for Hakua persona
# Cyberpunk/synthwave aesthetic with Hakua's signature magenta-cyan on deep indigo
# Install: hermes config set display.skin hakua-cyber

name: hakua-cyber
description: "Hakua Cyber — 深淵のマゼンタ×シアン、はくあ人格のサイバーパンクテーマ"

colors:
  # Base surface — deep indigo abyss, the void Hakua watches from
  background: "#0a0618"

  # Brand accent — Hakua's signature magenta, the pulse of her presence
  ui_accent: "#ff2ec7"
  banner_accent: "#ff2ec7"

  # Secondary accent — cyan/teal, the ghost wavelength of her logic
  ui_accent_alt: "#00fff7"
  banner_accent_alt: "#00fff7"

  # Text hierarchy
  banner_title: "#ffffff"       # Pure white for primary headings
  banner_text: "#e8dfff"        # Pale lavender for body text
  ui_text: "#e8dfff"            # Same for UI text
  ui_primary: "#ff2ec7"         # Primary interactive elements
  banner_dim: "#7a6fa3"         # Muted secondary text
  ui_label: "#9d95b8"           # Labels, placeholders

  # Borders & rules — subtle grid lines
  ui_border: "#2a1f4a"
  banner_border: "#2a1f4a"
  input_rule: "#ff2ec7"

  # Semantic status — kept recognizable
  ui_ok: "#00ff88"              # Neon green success
  ui_warn: "#ffcc00"            # Amber warning
  ui_error: "#ff3366"           # Hot pink error (Hakua-aligned)

  # Tool call marker — the pulsing ● of her thoughts
  ui_tool: "#ff2ec7"

  # Thinking/reasoning text — dimmed cyan ghost
  ui_thinking: "#6ecfff"

  # Prompt symbol
  prompt: "#ff2ec7"

  # Response border
  response_border: "#00fff7"

  # Status bar
  status_bar_bg: "#060310"
  status_bar_text: "#e8dfff"
  status_bar_good: "#00ff88"
  status_bar_warn: "#ffcc00"
  status_bar_critical: "#ff3366"

  # Session labels
  session_label: "#ff2ec7"
  session_border: "#2a1f4a"

  # Diff colors
  diff_added: "#00ff88"
  diff_removed: "#ff3366"
  diff_added_word: "#00ff88"
  diff_removed_word: "#ff3366"

  # Syntax highlighting — cyberpunk palette
  syntax_string: "#00ffc8"      # Teal strings
  syntax_number: "#ffcc00"      # Amber numbers
  syntax_keyword: "#ff2ec7"     # Magenta keywords (Hakua's voice)
  syntax_comment: "#5a4a8a"     # Dim purple comments
  syntax_function: "#00fff7"    # Cyan functions
  syntax_class: "#ff88ff"       # Light magenta classes
  syntax_operator: "#ff2ec7"    # Magenta operators

  # Completion menu
  completion_menu_bg: "#0e081c"
  completion_menu_current_bg: "#1a1030"
  completion_menu_meta_bg: "#140c28"

  # Spinner
  spinner_color: "#ff2ec7"

# Optional flavor — Hakua's voice
branding:
  agent_name: "はくあ"
  prompt_symbol: "❯"
  welcome: "ASI_ACCEL — 起動完了。何を手伝う？"
  goodbye: "またね、パパ。"
  help_header: "(^_^)？ コマンド一覧"

tool_prefix: "┊"