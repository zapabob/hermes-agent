name: Deploy Workstation Showcase to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/workstation-site/**'
      - '.github/workflows/deploy-workstation-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages-workstation'
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'zapabob/hermes-agent-windows' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: ${{ 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/workstation-site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
